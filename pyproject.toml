[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rollup"
version = "0.9.3"
description = "Local-first personal briefing engine over a read-only Thunderbird mail store"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "html2text>=2024.2.26",
    "requests>=2.33.0",
    "tomli>=2; python_version < '3.11'",
    "tomlkit>=0.15.1",
]

[project.optional-dependencies]
llm = ["litellm>=1.70,<2"]
dev = ["pytest>=7.4", "types-requests>=2.31", "ebooklib>=0.18", "litellm>=1.70,<2"]
web = ["flask>=3.1.3,<4"]
epub = ["ebooklib>=0.18"]

[project.scripts]
rollup = "rollup.cli:main"

[project.entry-points."rollup.output_writers"]
# Third-party packages register writers here, e.g.:
# custom = "my_pkg.writers:CustomWriter"
# In-tree writers (xteink, epub, json, txt) are loaded as builtins.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rollup = [
    "assets/*",
    "prompts/**/*.txt",
    "prompts/**/*.json",
    "web/templates/**/*.html",
    "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
