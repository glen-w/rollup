[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rollup"
version = "0.12.0"
description = "Local-first personal briefing engine over a read-only Thunderbird mail store"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "html2text>=2024.2.26",
    "requests>=2.33.0",
    "tomli>=2; python_version < '3.11'",
    "tomlkit>=0.15.1",
]

[project.optional-dependencies]
llm = ["litellm>=1.70,<2"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.14",
    "mypy>=1.18",
    "pip-audit>=2.7",
    "types-requests>=2.31",
    "types-beautifulsoup4>=4.12",
    "ebooklib>=0.18",
    "litellm>=1.70,<2",
]
web = ["flask>=3.1.3,<4"]
epub = ["ebooklib>=0.18"]
docs = [
    "sphinx>=7.0.0",
    "myst-parser>=2.0.0",
    "furo>=2023.9.10",
    "sphinx-autobuild>=2021.3.14",
    "sphinxcontrib-mermaid>=0.9.2",
    "sphinx-autodoc-typehints>=1.24.0",
]

[project.scripts]
rollup = "rollup.cli:main"

[project.entry-points."rollup.output_writers"]
# Third-party packages register writers here, e.g.:
# custom = "my_pkg.writers:CustomWriter"
# In-tree writers (xteink, epub, json, txt) are loaded as builtins.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rollup = [
    "assets/*",
    "prompts/**/*.txt",
    "prompts/**/*.json",
    "web/templates/**/*.html",
    "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["rollup"]
branch = false

[tool.coverage.report]
skip_covered = false
show_missing = false
omit = ["src/rollup/web/templates/*"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs", "website", "extension", "_site", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Long lines are a formatting concern, not a correctness gate.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["rollup"]

[tool.mypy]
python_version = "3.10"
files = ["src/rollup"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = false
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
pretty = false
