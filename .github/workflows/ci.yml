name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Smoke only. Restore ruff / mypy / pytest coverage / the Python matrix /
# compose-preview once `make check` stays green on main (see docs/ROADMAP.md).
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --python 3.12
      - name: Version
        run: uv run rollup --version
      - name: Fixture doctor
        run: |
          mkdir -p /tmp/rollup-ci-smoke/{state,output,logs}
          uv run rollup doctor \
            --config tests/fixtures/empty_config.toml \
            --root tests/fixtures/Newsletters.sbd \
            --mail-root tests/fixtures \
            --state-dir /tmp/rollup-ci-smoke/state \
            --output-dir /tmp/rollup-ci-smoke/output \
            --log-dir /tmp/rollup-ci-smoke/logs
      - name: Offline preview digest
        run: |
          uv run rollup digest \
            --config tests/fixtures/empty_config.toml \
            --root tests/fixtures/Newsletters.sbd \
            --mail-root tests/fixtures \
            --state-dir /tmp/rollup-ci-smoke/state \
            --output-dir /tmp/rollup-ci-smoke/output \
            --log-dir /tmp/rollup-ci-smoke/logs \
            --lookback-days 3650 \
            --no-ollama \
            --no-linkedin \
            --no-reddit \
            --no-webpage
          md="$(find /tmp/rollup-ci-smoke/output -name '*-newsletter-digest.md' | head -1)"
          test -n "$md"
          grep -q "Quick thoughts on learning" "$md"
