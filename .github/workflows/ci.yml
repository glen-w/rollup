name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (dev + web extras)
        run: uv sync --python ${{ matrix.python }} --extra dev --extra web
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - name: Types (mypy)
        run: uv run mypy
      - name: Tests with coverage gate
        run: uv run python -m pytest tests/ -q --cov=rollup --cov-report=term --cov-report=xml --cov-fail-under=80
      - name: Dependency audit
        # Advisory only: a new CVE in a transitive dep should not block unrelated PRs.
        continue-on-error: true
        run: uv run pip-audit --skip-editable --progress-spinner off
      - name: Upload coverage
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  compose-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compose preview digest (no Ollama, no override.yml)
        run: ./scripts/ci-compose-preview.sh
      - name: Upload preview digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-digest
          path: ci-artifact/preview-digest.md
          if-no-files-found: error
